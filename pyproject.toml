[project]
name = "mealplan"
version = "0.1.0"
description = "Recipe & meal planner: SQLite-backed REST server with CLI, TUI, and GUI clients"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "textual>=0.80",
]

[project.scripts]
mealplan-server = "server.main:main"
mealplan        = "cli.main:main"
mealplan-tui    = "tui.app:main"
mealplan-gui    = "gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "cli", "tui", "gui", "mealplan_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
